<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="kc_grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="kc_cap" x1="32" y1="28" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222328"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <filter id="kc_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#121316" stroke="#27272A" stroke-width="2"/>
  
  <!-- Sound Acoustic Waves -->
  <path d="M 22 52 A 16 16 0 0 0 22 76" stroke="url(#kc_grad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 16 44 A 26 26 0 0 0 16 84" stroke="url(#kc_grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 106 52 A 16 16 0 0 1 106 76" stroke="url(#kc_grad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 112 44 A 26 26 0 0 1 112 84" stroke="url(#kc_grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Mechanical Keycap Body with Isometric Angle -->
  <g filter="url(#kc_glow)">
    <path d="M36 40 C36 34, 40 30, 46 30 L82 30 C88 30, 92 34, 92 40 L96 82 C96 90, 90 96, 82 96 L46 96 C38 96, 32 90, 32 82 Z" fill="url(#kc_cap)" stroke="url(#kc_grad)" stroke-width="2.5"/>
    <path d="M42 38 C42 35, 45 34, 48 34 L80 34 C83 34, 86 35, 86 38 L84 72 C84 75, 81 78, 78 78 L50 78 C47 78, 44 75, 44 72 Z" fill="#272830" stroke="#3F3F46" stroke-width="1.5"/>

    <!-- Mechanical Switch Stem / Cross -->
    <rect x="61" y="47" width="6" height="18" rx="2" fill="url(#kc_grad)"/>
    <rect x="55" y="53" width="18" height="6" rx="2" fill="url(#kc_grad)"/>
  </g>
</svg>
